name: Import Prismora source

on:
  push:
    paths:
      - ".github/workflows/import-prismora.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Prismora source
        shell: bash
        run: |
          cat .upload/chunk* > /tmp/prismora.b64
          base64 -d /tmp/prismora.b64 > /tmp/prismora.tar.gz
          tar -xzf /tmp/prismora.tar.gz -C .
          rm -rf .upload
          rm -f .github/workflows/import-prismora.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Prismora v3.15.0 source"
          git push
